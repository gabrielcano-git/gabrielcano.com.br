<footer class="site-footer"><div class="wrap">
  <span>© {{ site.time | date: '%Y' }} Gabriel Cano · Desenvolvimento, escrita e comunidade.</span>
  <nav class="footer-links" aria-label="Navegação do rodapé">
    <a href="https://github.com/{{ site.author.github | escape }}/">GitHub</a>
    {% for profile in site.data.social %}
    <a href="{{ profile.url | escape }}" target="_blank" rel="me noopener noreferrer">{{ profile.name | escape }}<span class="sr-only"> (abre em nova aba)</span></a>
    {% endfor %}
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <a href="{{ '/contato/' | relative_url }}">Contato</a>
  </nav>
</div></footer>
