<header class="site-header"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Gabriel Cano, início">gabriel<span>cano.</span></a>
  <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-controls="site-nav" aria-expanded="false">☰</button>
  <nav id="site-nav" class="site-nav" aria-label="Navegação principal">
    {% for item in site.nav %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif item.url == '/blog/' and paginator.page > 1 %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
    <a class="nav-contact" href="{{ '/contato/' | relative_url }}"{% if page.url == '/contato/' %} aria-current="page"{% endif %}>Vamos conversar <span aria-hidden="true">↗</span></a>
  </nav>
</div></header>
