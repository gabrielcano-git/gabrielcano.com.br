<!doctype html>
<html lang="{{ site.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="Artigos de Gabriel Cano" href="{{ '/feed.xml' | relative_url }}">
  <script>document.documentElement.classList.add('js');</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#principal">Pular para o conteúdo</a>
  {% include header.html %}
  <main id="principal" class="wrap" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
